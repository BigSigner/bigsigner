[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigsigner"
version = "0.1.0"
description = "Air-gapped Bitcoin signer for a portrait touchscreen."
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
  "embit==0.8.0",
  "Pillow==10.3.0",
  "qrcode==8.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[project.scripts]
bigsigner = "bigsigner.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bigsigner = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
